<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ec1c24" />
    <title>%VITE_APP_NAME%</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a light/dark flash.
      // Reads the same localStorage entry the Zustand theme store persists to.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('theme') || 'null');
          var theme = saved && saved.state && saved.state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
